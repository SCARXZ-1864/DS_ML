[project]
name = "review-intel-inference"
version = "0.1.0"
description = "FastAPI inference service (HF Space) for the Customer Review Intelligence Tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
deploy = [
    "modal>=1.6.1",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
